<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Apply for a position at NovaCart">
  <title>Apply | NovaCart Careers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NovaCart Careers</h1>
    <p>Join the team building the future of online shopping</p>
  </header>

  <main>
    <form id="applyForm" action="process_eoi.php" method="post" novalidate="false">

      <fieldset>
        <legend>Position</legend>

        <div class="field">
          <label for="jobref">Job reference number <span class="hint">(exactly 5 letters or numbers)</span></label>
          <input type="text" id="jobref" name="jobref" required
                 minlength="5" maxlength="5" pattern="[A-Za-z0-9]{5}"
                 placeholder="e.g. NC001" title="Exactly 5 alphanumeric characters">
        </div>

        <div class="field">
          <label for="position">Position applied for</label>
          <select id="position" name="position" required>
            <option value="" selected disabled>Select a position</option>
            <option value="Front-End Web Developer">Front-End Web Developer</option>
            <option value="UX/UI Designer">UX/UI Designer</option>
            <option value="Digital Marketing Specialist">Digital Marketing Specialist</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Personal details</legend>

        <div class="row">
          <div class="field">
            <label for="firstname">First name</label>
            <input type="text" id="firstname" name="firstname" required
                   maxlength="20" pattern="[A-Za-z]{1,20}"
                   autocomplete="given-name" title="Letters only, maximum 20 characters">
          </div>
          <div class="field">
            <label for="lastname">Last name</label>
            <input type="text" id="lastname" name="lastname" required
                   maxlength="20" pattern="[A-Za-z]{1,20}"
                   autocomplete="family-name" title="Letters only, maximum 20 characters">
          </div>
        </div>

        <div class="field">
          <label for="dob">Date of birth <span class="hint">(dd/mm/yyyy)</span></label>
          <input type="text" id="dob" name="dob" required
                 maxlength="10" placeholder="dd/mm/yyyy" inputmode="numeric"
                 pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/(19|20)[0-9]{2}"
                 title="Enter your date of birth as dd/mm/yyyy">
        </div>

        <fieldset>
          <legend>Gender</legend>
          <div class="options">
            <label for="genderFemale"><input type="radio" id="genderFemale" name="gender" value="Female" required> Female</label>
            <label for="genderMale"><input type="radio" id="genderMale" name="gender" value="Male"> Male</label>
            <label for="genderOther"><input type="radio" id="genderOther" name="gender" value="Other"> Other</label>
            <label for="genderNone"><input type="radio" id="genderNone" name="gender" value="Prefer not to say"> Prefer not to say</label>
          </div>
        </fieldset>
      </fieldset>

      <fieldset>
        <legend>Address</legend>

        <div class="field">
          <label for="street">Street address</label>
          <input type="text" id="street" name="street" required maxlength="40"
                 autocomplete="street-address" title="Maximum 40 characters">
        </div>

        <div class="field">
          <label for="suburb">Suburb/Town</label>
          <input type="text" id="suburb" name="suburb" required maxlength="40"
                 autocomplete="address-level2" title="Maximum 40 characters">
        </div>

        <div class="row">
          <div class="field">
            <label for="state">State</label>
            <select id="state" name="state" required>
              <option value="" selected disabled>Select a state</option>
              <option value="VIC">VIC</option>
              <option value="NSW">NSW</option>
              <option value="QLD">QLD</option>
              <option value="NT">NT</option>
              <option value="WA">WA</option>
              <option value="SA">SA</option>
              <option value="TAS">TAS</option>
              <option value="ACT">ACT</option>
            </select>
          </div>
          <div class="field">
            <label for="postcode">Postcode</label>
            <input type="text" id="postcode" name="postcode" required
                   minlength="4" maxlength="4" pattern="[0-9]{4}" inputmode="numeric"
                   autocomplete="postal-code" title="Exactly 4 digits">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contact</legend>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="phone">Phone number <span class="hint">(8–12 digits)</span></label>
          <input type="tel" id="phone" name="phone" required
                 minlength="8" maxlength="12" pattern="[0-9]{8,12}" inputmode="numeric"
                 autocomplete="tel" title="8 to 12 digits, no spaces">
        </div>
      </fieldset>

      <fieldset>
        <legend>Skills</legend>

        <div class="skills" id="skillList" role="group" aria-label="Skill list">
          <label for="skillHtml"><input type="checkbox" id="skillHtml" name="skills[]" value="HTML5" required> HTML5</label>
          <label for="skillCss"><input type="checkbox" id="skillCss" name="skills[]" value="CSS3"> CSS3</label>
          <label for="skillJs"><input type="checkbox" id="skillJs" name="skills[]" value="JavaScript"> JavaScript</label>
          <label for="skillResp"><input type="checkbox" id="skillResp" name="skills[]" value="Responsive design"> Responsive design</label>
          <label for="skillA11y"><input type="checkbox" id="skillA11y" name="skills[]" value="Accessibility"> Accessibility (WCAG)</label>
          <label for="skillFigma"><input type="checkbox" id="skillFigma" name="skills[]" value="Figma"> Figma / Adobe XD</label>
          <label for="skillResearch"><input type="checkbox" id="skillResearch" name="skills[]" value="User research"> User research</label>
          <label for="skillSeo"><input type="checkbox" id="skillSeo" name="skills[]" value="SEO/SEM"> SEO / SEM</label>
          <label for="skillSocial"><input type="checkbox" id="skillSocial" name="skills[]" value="Social media marketing"> Social media marketing</label>
          <label for="skillAnalytics"><input type="checkbox" id="skillAnalytics" name="skills[]" value="Analytics"> Web analytics</label>
        </div>

        <div class="field">
          <label for="otherskills">Other skills <span class="hint">(optional)</span></label>
          <textarea id="otherskills" name="otherskills" rows="5"
                    placeholder="Tell us about any additional skills or qualifications"></textarea>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit">Submit application</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </main>

  <footer>&copy; 2026 NovaCart. All rights reserved.</footer>

  <script>
    // Require at least one skill checkbox: all are required until one is ticked.
    (function () {
      var boxes = document.querySelectorAll('#skillList input[type="checkbox"]');
      function sync() {
        var any = Array.prototype.some.call(boxes, function (b) { return b.checked; });
        boxes.forEach(function (b) { b.required = !any; });
      }
      boxes.forEach(function (b) { b.addEventListener('change', sync); });
      document.getElementById('applyForm').addEventListener('reset', function () {
        setTimeout(sync, 0);
      });
      sync();
    })();
  </script>
</body>
</html>
